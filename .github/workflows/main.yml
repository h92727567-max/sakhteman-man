name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/sakhteman-man.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sakhteman-man-release
          path: dist/sakhteman-man.apk
          if-no-files-found: error

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/sakhteman-man.apk \
            --title "ساختمان من v1.0.${{ github.run_number }}" \
            --notes "نسخه انتشار برای کافه بازار. ورود آزمایشی: هر شماره موبایل + کد تایید 1234"
